# ============================================================
# 本地零工平台 —— 后端配置
# 连接信息与 docker-compose.yml 保持一致，仅本地开发用。
# 生产环境请改用环境变量 / 配置中心，不要把真实密码提交到仓库。
# ============================================================

server:
  port: 8080

spring:
  application:
    name: linggong-backend

  # ---------- MySQL ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/linggong?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: "123456"   # 与 docker-compose.yml 的 MYSQL_ROOT_PASSWORD 一致

  # ---------- Redis ----------
  data:
    redis:
      host: localhost
      port: 6379
      # 教学阶段不设密码（与 docker-compose.yml 一致）
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms

  # ---------- RabbitMQ ----------
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # 手动 ACK：报名消费者落单成功后手动确认，失败 basicNack 进死信队列
    listener:
      simple:
        acknowledge-mode: manual
    # 发布确认：correlated 模式 + 不可达路由退回，配合 RabbitConfig 的 confirm/return 回调，让报名消息投递可确认
    publisher-confirm-type: correlated
    publisher-returns: true

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# ---------- 接口文档（Knife4j / springdoc） ----------
# 注意：不要关闭 springdoc.swagger-ui（enabled: false）。
# knife4j 的 /doc.html 依赖 /v3/api-docs/swagger-config 发现分组，而该接口挂在 swagger-ui 配置下，
# 关掉会导致 swagger-config 不支持 GET、文档页拿不到分组。
springdoc:
  api-docs:
    path: /v3/api-docs

knife4j:
  # 4.5.0 的“增强模式”会调用 springdoc 已变更的 getGroupConfigs()（List→Map），
  # 与 Boot 3.5 + springdoc 2.8.x 冲突会报 NoSuchMethodError，故关闭增强、只保留 /doc.html 这个 UI。
  enable: false
  setting:
    language: zh_cn           # 界面中文

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true          # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印 SQL

# ---------- 日志 ----------
logging:
  level:
    com.linggong: debug

# ---------- 自定义配置 ----------
linggong:
  upload:
    dir: ${user.dir}/uploads/
  # 高德地图 Web服务 Key（逆地理编码用）。个人 Key 不入库，运行时用环境变量 AMAP_KEY 注入：
  #   Git Bash：  export AMAP_KEY=你的key && mvn spring-boot:run
  #   CMD：       set AMAP_KEY=你的key && mvn spring-boot:run
  #   （一次性持久化：setx AMAP_KEY 你的key，之后重启终端即可）
  amap:
    key: ${AMAP_KEY:}
