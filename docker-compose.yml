# ============================================================
# 本地零工平台 —— 开发环境一键启动（MySQL / Redis / RabbitMQ）
#
# 用法：在项目根目录（本文件所在目录）执行
#   docker compose up -d
# 停止：
#   docker compose down
# （加 -v 会连数据卷一起删除，慎用）
#
# 三个服务各自用命名数据卷持久化，容器重启数据不丢。
# ============================================================

services:
  # ---------- MySQL 8.0 ----------
  mysql:
    image: mysql:8.0
    container_name: linggong-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"          # root 密码（与 application.yml 保持一致）
      MYSQL_DATABASE: linggong               # 首次启动自动创建的库
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"   # 宿主 3307 → 容器 3306（本机原生 MySQL 已占 3306，故映射到 3307）
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Redis 7 ----------
  redis:
    image: redis:7
    container_name: linggong-redis
    restart: unless-stopped
    # 教学阶段不设密码，方便调试；上线务必开启 requirepass
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- RabbitMQ 3（含管理台） ----------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: linggong-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest          # 默认账号（与 application.yml 保持一致）
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP 协议端口（后端连这个）
      - "15672:15672"    # 管理台网页（浏览器访问 http://localhost:15672）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

# 命名数据卷
volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
