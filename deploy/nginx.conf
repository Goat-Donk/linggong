# ============================================================
# 本地零工平台 —— 生产环境 nginx 配置
#
# 作用：
#   1. 托管前端构建产物（frontend/dist）
#   2. SPA history 路由回退：/job/8、/feed 等前端路由直接访问/刷新时回退到 index.html
#   3. 反代 /api 到后端（去掉 /api 前缀，与 vite dev 代理保持一致）
#   4. 反代 /uploads 到后端（保留完整路径，后端 MvcConfig 映射 /uploads/** 本地目录）
#
# 反代后前端与接口同源，浏览器无需 CORS，token 经 authorization 头原样透传。
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # gzip 压缩静态资源，减小传输体积
    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        # 前端构建产物目录（按实际部署路径调整；Windows 用正斜杠）
        root   D:/linggong/frontend/dist;
        index  index.html;

        # ---------- 静态资源缓存 ----------
        # 带 hash 的构建产物可长缓存；index.html 不缓存，保证发版即时生效
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ---------- 后端接口反代 ----------
        # 前端统一请求 /api/xxx，这里去掉 /api 前缀转发到后端（后端接口无 /api 前缀）
        location /api/ {
            proxy_pass         http://127.0.0.1:8080/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------- 上传图片反代 ----------
        # /uploads/** 保留完整路径转发，由后端 MvcConfig 映射本地目录
        location /uploads/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ---------- SPA 路由回退 ----------
        # history 模式路由没有对应静态文件，回退到 index.html 交给 vue-router 处理
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
